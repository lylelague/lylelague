name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22 # node --test only expands globs from Node 21

      # Every repo with code on this account is private, so GITHUB_TOKEN would see
      # almost nothing. STATS_TOKEN: fine-grained PAT, resource owner lylelague,
      # All repositories, Metadata read-only.
      - name: Require STATS_TOKEN
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::error title=STATS_TOKEN not set::Add a fine-grained PAT (All repositories, Metadata read-only) as the STATS_TOKEN repo secret so the stats card can read private repos."
            exit 1
          fi

      - name: Test the card builders
        run: node --test "scripts/profile/*.test.mjs"

      # Fails without writing if any GitHub call fails, so the last good card stays.
      - name: Build stats card
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node scripts/profile/build-stats.mjs

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats-*.svg
          git commit -m "Update README cards" || exit 0
          git push
